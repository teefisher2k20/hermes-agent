# Netlify Production Deployment Configuration for Hermes Agent

[build]
  base = "website"
  command = "npm install --legacy-peer-deps --engine-strict=false && npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22.22.0"
  NPM_FLAGS = "--legacy-peer-deps"

# Production environment context
[context.production.environment]
  NETLIFY = "true"

# Deploy Preview environment context
[context.deploy-preview.environment]
  NETLIFY = "true"

# Redirect site root / to /docs/ (matching Docusaurus baseUrl setting)
[[redirects]]
  from = "/"
  to = "/docs/"
  status = 301
  force = false

# SPA Fallback for single-page dashboard builds if web workspace is deployed
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200

# Cache static headers for assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
