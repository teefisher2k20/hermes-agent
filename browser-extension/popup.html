<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hermes Agent Controller</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .title {
      font-weight: 600;
      font-size: 15px;
      color: #38bdf8;
    }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 9999px;
      font-weight: 500;
    }
    .badge-connected {
      background-color: #059669;
      color: #ecfdf5;
    }
    .badge-disconnected {
      background-color: #dc2626;
      color: #fef2f2;
    }
    textarea {
      width: 100%;
      height: 70px;
      box-sizing: border-box;
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      padding: 8px;
      font-size: 13px;
      resize: none;
      margin-bottom: 10px;
    }
    textarea:focus {
      outline: none;
      border-color: #38bdf8;
    }
    button {
      width: 100%;
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0369a1;
    }
    .logs {
      margin-top: 12px;
      background-color: #020617;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 8px;
      font-family: monospace;
      font-size: 11px;
      max-height: 100px;
      overflow-y: auto;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Hermes Browser Agent</div>
    <div id="statusBadge" class="badge badge-disconnected">Offline</div>
  </div>

  <textarea id="taskPrompt" placeholder="Ask Hermes to perform a task in this tab..."></textarea>
  <button id="dispatchBtn">Run Autonomous Task</button>

  <div class="logs" id="logBox">
    [System] Connecting to Hermes Gateway (ws://127.0.0.1:9119)...
  </div>

  <script src="popup.js"></script>
</body>
</html>
